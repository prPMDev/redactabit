[package]
name = "redactabit"
version = "0.2.0"
description = "Redact-a-bit — local, offline document redaction. Nothing leaves your machine."
authors = ["prPMDev"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/prPMDev/redactabit"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
