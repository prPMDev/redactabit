name: Deploy site to GitHub Pages

# Publishes the static site in site/ to GitHub Pages.
# One-time setup: Settings → Pages → Source → "GitHub Actions".

# PAUSED until launch: the repo is private, so GitHub Pages isn't enabled and this deploy fails on
# every push that touches site/. To re-enable at launch: (1) make the repo public, (2) Settings →
# Pages → Source → "GitHub Actions", (3) uncomment the `push:` trigger below. Until then it only
# runs on manual dispatch, so it never auto-fails. (Does not affect CI, builds, or local dev.)
on:
  # push:                       # ← restore at launch (repo public + Pages enabled)
  #   branches: [main]
  #   paths:
  #     - 'site/**'
  #     - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
